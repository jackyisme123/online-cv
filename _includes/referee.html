{% assign referee = site.data.data.referee %}
{% if referee %}
  <div class="referee-container container-block">

    <h2 class="container-block-title">
      {{ referee.title }}
    </h2>

    {% for r in referee.info %}
    <div class="item">
      <span class="referee-text" style="font-size: 7pt !important; font-weight: normal !important; color: #222222 !important;">{{ r.name }}</span>
      <h5 class="jobtitle">{{ r.jobtitle }}</h5>
    </div><!--//item-->
    {% endfor %}
  </div><!--//referee-container-->
{% endif %}
