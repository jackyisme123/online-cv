career-profile:
    title: Career Profile
    summary: |
      Site Reliability & Software Engineer with 8 years of experience building software, running cloud operations, and keeping production systems stable. Currently driving AI projects, agentic workflows, and LLMOps solutions as an AI Activator. Comfortable diving deep into code and data to debug complex production outages, unblock customers fast, and manage on-call operations across on-prem and cloud. Passionate about sharpening system observability through clean, structured logging and dashboards that actually point to the problem. Focuses on bridging Dev and Ops by writing code that cuts out repetitive toil, from building internal automation tools and CI/CD release gates to setting up AI incident triage pipelines that speed up root-cause analysis and bring down MTTR.

