experiences:
    title: Work Experience
    info:
      - role: Platform Reliability Engineer (GenAI & Automation Activator)
        time: Aug 2023 - Present
        company: IAG (Insurance Australia Group, ASX Top 50), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">GenAI Platform Operations & Incident Management:</strong> Serve as the primary technical point of contact for internal platform services and GenAI tooling while maintaining 24/7 on-call coverage. Manage support queues, prioritize incidents by user impact and urgency, coordinate high-priority incident bridge calls, and investigate complex issues across cloud & VM infrastructure, backend APIs, and microservices (with routine Kubernetes pod/log triage). Analyze logs, metrics, traces, API payloads, and authentication flows to distinguish between user configuration errors, operational degradation, and software bugs, conducting blameless postmortems to implement preventive reliability safeguards.
          - <strong style="color: #666666;">Observability, Alerting & Bug Fixing:</strong> Build and maintain full-stack observability dashboards (Datadog, NewRelic, Splunk, Grafana) and proactive SLO/SLA alerts. Correlate distributed traces (OpenTelemetry) and structured logs to diagnose transient errors; isolate root causes, reproduce bugs with actionable evidence, and deliver direct code/configuration bug fixes or coordinate targeted escalations to core engineering teams.
          - <strong style="color: #666666;">AIOps Agentic Triage & Support Automation:</strong> Engineered production GenAI triage agents (Gemini, GCP Cloud Run, Vertex AI) and internal FastMCP servers that automatically ingest Datadog telemetry, cloud logs, and ServiceNow records. Generate automated diagnostic context and draft remediation pull requests, reducing mean time to triage (MTTR) from hours to minutes.
          - <strong style="color: #666666;">User Enablement, Feedback Loops & Toil Reduction:</strong> Partner closely with business users and product teams to translate repetitive support inquiries into automated self-service capabilities (including a Text-to-SQL data retrieval engine). Document troubleshooting runbooks and author Python/PowerShell automation scripts, eliminating over 1,000 hours of manual operational toil per year.
      - role: Full Stack Software Engineer
        time: 2018 - 2023
        company: FIS (Fortune 500 Financial Technology Leader), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Enterprise Platform Development & Delivery:</strong> Progressed from cross-functional rotations across support, release management, and DevOps into full-stack C#/.NET feature development. Engineered and delivered core banking/asset finance modules and enterprise client customizations for Tier-1 global financial institutions (HSBC, BMW, Toyota), while investigating complex edge cases, reproducing software bugs with actionable evidence, and delivering production bug fixes.
          - <strong style="color: #666666;">Low-Code Workflow Engine & Self-Service Configuration:</strong> Co-developed an extensible business rules and workflow engine for the core asset finance platform, enabling non-technical analysts and client operations teams to configure custom business logic and workflows without code deployments, drastically lowering support ticket volume.
          - <strong style="color: #666666;">Performance Optimization & Database Troubleshooting:</strong> Diagnosed and resolved critical concurrency bottlenecks, database deadlocks, and slow query executions in high-throughput environments. Re-architected computationally heavy rating calculations with pre-calculation caching, slashing execution time from 60 seconds to 20 seconds.
          - <strong style="color: #666666;">Operational Tooling & Knowledge Enablement:</strong> Built automated diagnostic scripts, internal test utilities, and structured troubleshooting documentation to streamline client onboarding, environment provisioning, and junior engineer mentoring.
      - role: Software Engineering Intern
        time: 2017 - 2018 (3 months)
        company: Weta Workshop (Academy Award-Winning Creative Studio), Wellington, New Zealand
        details: |
          - <strong style="color: #666666;">Asset Pipeline Automation:</strong> Built containerized plugins and Python/PowerShell automation scripts to connect internal production creative tools directly with asset tracking APIs, eliminating manual asset entry and repetitive operational overhead.
          - <strong style="color: #666666;">Internal Tooling & Platform Extensions:</strong> Developed custom Confluence wiki extensions that natively rendered 3D model formats within internal documentation pages, bridging cross-functional communication between creative artists and technical engineers.
      - role: Working Holiday & International Transition
        time: 2015 - 2016
        company: New Zealand
        details: |
          - <strong style="color: #666666;">International Transition & Language Immersion:</strong> Relocated to New Zealand on a Working Holiday visa, developing professional English fluency and cross-cultural adaptability while preparing for academic transition into Computer Science.
      - role: Chemical Engineer (Continuous Improvement & Process Operations)
        time: 2008 - 2014
        company: LG Chem (Global Fortune 500 Chemical & Materials Manufacturer), Tianjin, China
        details: |
          - <strong style="color: #666666;">Root-Cause Analysis & Quality Engineering:</strong> Applied Six Sigma methodologies, statistical process control (SPC), and rigorous root-cause investigation to eliminate batch defects, enhance operational yields, and enforce quality standards.
          - <strong style="color: #666666;">Plant Turnaround & Operational Leadership:</strong> Orchestrated annual plant turnarounds, directing cross-functional engineering and maintenance teams during 15–20 day full facility shutdowns for comprehensive preventative inspections and equipment overhauls with zero safety incidents.
          - <strong style="color: #666666;">Process Innovation & Energy Efficiency:</strong> Spearheaded engineering initiatives on thermal and power energy optimization across manufacturing lines, cutting utility overhead and minimizing environmental impact.
