      - title: Agentic Incident Triage Engine
        link: "#"
        tagline: 'Designed an automated triage and data enrichment system using agentic workflows (Gemini, Cloud Run, Vertex AI, vector databases). Integrates multi-system APIs (ServiceNow, Datadog, Salesforce, Guidewire Cloud, AWS S3, BigQuery) to fetch logs and context, executing automated root-cause analysis and generating draft remediation PRs within strict AI safety boundaries.'
      - title: Enterprise Self-Service Portal & AI Data Query Engine
        link: "#"
        tagline: 'Engineered an extensible self-service framework enabling authorized business users to independently execute user account changes, commission updates, and Guidewire PolicyCenter configuration updates. Integrated with enterprise identity systems and ServiceNow APIs for automated entitlement checks. Built an MCP server to convert natural language queries into BigQuery SQL for complex business data extraction requests, with continuous iterations underway as part of future roadmap plans.'
      - title: Incident Classification MLOps Pipeline (side project)
        link: "#"
        tagline: 'Built an end-to-end MLOps pipeline (MLflow, Docker, Flask, GitHub Actions, Evidently, Grafana) to benchmark and route support tickets instantly. Proved that classical supervised machine learning achieved superior inference speed and accuracy compared to local open-source LLMs. Implemented automated experiment tracking, containerized API serving, CI/CD deployment, and real-time drift monitoring for continuous model reliability.'
