experiences:
    title: Working Experiences
    info:
      - role: Platform Engineer & SRE
        time: Aug 2023 - Present
        company: IAG, Christchurch, New Zealand (Hybrid)
        details: |
          - Ops-to-SRE Organizational Transformation: Led a 6-month initiative transitioning legacy operations to an SRE model through gap/risk assessments and clear DevOps vs. SRE boundaries, building a software-focused SRE team that eliminated over 1,000 hours of operational toil per year.
          - Agentic AI Incident Triage (GCP, in rollout): Architected and locally validated an autonomous AI Agent using RAG and loop engineering, delivering ~30x faster incident triage to resolution; passed enterprise architecture review for production rollout on GCP (Gemini, Cloud Run, Vertex AI, Google ADK). Integrated RAG search across Guidewire API, Datadog, Bitbucket, ServiceNow, Salesforce, and Atlassian MCP for enriched analysis, high-accuracy RCAs, customer workarounds, and automated Jira tickets with draft code fixes within strict AI safety boundaries.
          - Business Workflow Data Automation: Cut processing time from several hours (or days during complex troubleshooting) down to under 10 minutes per request with a Python engine that parses ServiceNow tickets to auto-generate Gosu database scripts. Removed manual public-ID mapping and data corruption risks, while embedding structured logging in Gosu scripts to enable rapid operational troubleshooting.
          - Async Queue Auto-Remediation: Engineered automated incident conversion and self-healing for broker portal queues using keyword-driven Runbook as Code, with atomic transaction rollback safety and workload visibility for management.
          - AI Governance & Pre-Release Quality: Built an AI-powered pre-release review tool using prompt engineering to catch build mismatches and documentation gaps before deployment, plus an agent triaging vulnerabilities and Dependabot alerts.
          - Platform Reliability, Security & Cost: Secured 160+ production services with full-stack telemetry (New Relic, Datadog) and RBAC migrations, while cutting licensing fees via Jenkins pipelines for Akamai usage and Netskope network-layer IP whitelisting for compliant S3 transfers.
      - role: Full Stack Software Engineer
        time: 2018 - 2023
        company: FIS, Christchurch, New Zealand (Hybrid)
        details: |
          - Full Stack Software Engineer on an enterprise finance and accounting platform, delivered to international banks and financial service providers. Designed and built RESTful APIs and modern front-end interfaces (Knockout.js/TypeScript, .NET/C#, SQL, Oracle) across the full lifecycle, from requirements and architecture through to production support.
          - Led technical analysis, estimation, and delivery of complex client and regulatory requirements, translating business and compliance needs into robust, scalable software while ensuring strict financial data accuracy and audit-readiness.
          - Architectured performance and scalability improvements and integrated third-party SaaS APIs and backend CI/CD pipelines, improving application response times, maintainability, and deployment speed across global deployments.
          - Built and maintained comprehensive unit, integration, UI, and performance test suites across development, test, and UAT environments, applying analytical, critical thinking to quality engineering and release readiness.
          - Developed internal plugins, tools, and developer productivity automations shared via internal wikis and video documentation; mentored junior engineers and graduates and raised capability across the wider team.
projects:
    title: Projects
    intro: >
    assignments:
      - title: Agentic Incident Triage (Architecture & MVP)
        link: "#"
        tagline: "Designed an automated triage system using agentic workflows to parse incident webhooks, execute automated root-cause analysis (RCA), and generate draft remediation PRs. Built and validated a local MVP with GitHub Copilot; architecture review passed and production implementation with Gemini and Cloud Run is underway."
      - title: Release Whisperer AI Agent
        link: "#"
        tagline: "Architected and deployed a specialized GenAI agent on an internal enterprise platform (Geni) that cross-checks release documentation, implementation plans, deployment notes, ServiceNow change tickets, and Test Evidence Summary Reports (TESR). Flags document issues before release, such as incorrect go-live times, wrong build numbers, outstanding tests, and missing management approvals, reducing mistakes during release and auditing."
      - title: Incident Classification MLOps Pipeline (Side Project)
        link: "#"
        tagline: "Built an end-to-end MLOps pipeline to evaluate ticket classification approaches. Benchmarked traditional supervised ML models against local LLM prompts (Ollama / early LLaMA 3), finding classic ML superior for structured routing latency. Implemented model tracking (MLflow), containerized API serving (Docker/Flask), CI/CD pipelines (GitHub Actions), and drift monitoring (Evidently, Grafana, Datadog)."
      - title: Enterprise Self-Service Portal
        link: "#"
        tagline: "Engineered a self-service application enabling business users to fulfill requests independently, such as user creation, deactivation, and modification, and data extracts. Integrated with ServiceNow APIs and enterprise IAM (myAccess) to enforce automated identity, entitlement, and RBAC security checks before execution. For data extracts, incorporated an AI agent integrated with Google Data Platform to convert natural language requests into BigQuery."
