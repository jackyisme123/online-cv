experiences:
    title: Work Experience
    info:
      - role: Platform Reliability Engineer (Guidewire PolicyCenter & GenAI Systems)
        time: Aug 2023 - Present
        company: IAG (Insurance Australia Group, ASX Top 50), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Guidewire PolicyCenter Support, RCA & Bug Fixing:</strong> Support core Guidewire PolicyCenter, an enterprise backend platform built on Java and Gosu. Perform deep root-cause analysis (RCA) on production incidents, reproduce edge-case defects, and deliver Java/Gosu bug fixes and incremental feature enhancements. Investigate backend logs, database queries, and API integrations to resolve complex policy lifecycle and transaction errors.
          - <strong style="color: #666666;">Reliability & Observability for Variable Workloads:</strong> Strengthen backend reliability and visibility across unpredictable enterprise workloads by configuring full-stack observability (Datadog, New Relic, Splunk, Grafana) and OpenTelemetry distributed tracing. Analyze API payloads, microservice latencies, and Kubernetes pod metrics to establish proactive SLO alerts and safeguard system uptime.
          - <strong style="color: #666666;">AI Activator & Team Enablement:</strong> Serve as an AI Activator bridging enterprise AI strategy with practical squad adoption. Build reusable AI skills, standardized integration patterns, and developer tooling while mentoring team members to adopt GenAI safely and efficiently. Champion engineering best practices to accelerate internal AI initiatives, including the production Agentic Incident Triage Engine and Release Whisperer.
          - <strong style="color: #666666;">Self-Service Tooling, Explainability & Toil Reduction:</strong> Partner closely with business users and technical teams to translate repetitive operational inquiries into automated, explainable self-service workflows (including a Text-to-SQL data retrieval engine). Author Python/PowerShell automation scripts and troubleshooting runbooks, eliminating over 1,000 hours of manual operational toil annually.
      - role: Full Stack Software Engineer (Core Asset Finance Backend)
        time: 2018 - 2023
        company: FIS (Fortune 500 Financial Technology Leader), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Core Banking & Asset Finance Backend Engineering:</strong> Worked across Delivery and Customer Services engineering teams on a mission-critical backend financial platform (C#/.NET). Engineered core banking and asset finance modules, business logic, and client customizations for Tier-1 global financial institutions (HSBC, BMW Financial Services, Toyota Finance), ensuring strict transactional consistency and regulatory compliance.
          - <strong style="color: #666666;">Complex Troubleshooting, RCA & Production Bug Fixes:</strong> Served as an escalation point for mission-critical client incidents and edge cases. Investigated complex system failures across distributed transaction flows, reproduced bugs in isolated environments, and implemented robust C# code fixes and production patches.
          - <strong style="color: #666666;">Performance Optimization & Database Concurrency:</strong> Diagnosed and resolved severe concurrency bottlenecks, database deadlocks, and slow query executions in high-throughput transactional environments. Re-architected computationally heavy rating calculations with pre-calculation caching, reducing latency from 60 seconds to 20 seconds.
          - <strong style="color: #666666;">Low-Code Workflow Engine & Knowledge Enablement:</strong> Co-developed an extensible business rules and workflow engine within the core platform, allowing client operations teams to configure custom business logic without code deployments, significantly reducing support ticket volumes.
      - role: Software Engineering Intern
        time: 2017 - 2018 (3 months)
        company: Weta Workshop (Academy Award-Winning Creative Studio), Wellington, New Zealand
        details: |
          - <strong style="color: #666666;">Asset Pipeline Automation:</strong> Built containerized plugins and Python/PowerShell automation scripts to connect internal production creative tools directly with asset tracking APIs, eliminating manual asset entry and repetitive operational overhead.
          - <strong style="color: #666666;">Internal Tooling & Platform Extensions:</strong> Developed custom Confluence wiki extensions that natively rendered 3D model formats within internal documentation pages, bridging the gap between creative artists and technical engineers.
      - role: Working Holiday & International Transition
        time: 2015 - 2016
        company: New Zealand
        details: |
          - <strong style="color: #666666;">International Transition & Language Immersion:</strong> Relocated to New Zealand on a Working Holiday visa, developing professional English fluency and cross-cultural adaptability while preparing for an academic transition into Computer Science.
      - role: Chemical Engineer (Continuous Improvement & Process Operations)
        time: 2008 - 2014
        company: LG Chem (Global Fortune 500 Chemical & Materials Manufacturer), Tianjin, China
        details: |
          - <strong style="color: #666666;">Root-Cause Analysis & Quality Engineering:</strong> Applied Six Sigma methodologies, statistical process control (SPC), and rigorous root-cause investigation to eliminate batch defects, enhance operational yields, and enforce quality standards.
          - <strong style="color: #666666;">Plant Turnaround & Operational Leadership:</strong> Orchestrated annual plant turnarounds, directing cross-functional engineering and maintenance teams during 15- to 20-day full-facility shutdowns for comprehensive preventive inspections and equipment overhauls with zero safety incidents.
          - <strong style="color: #666666;">Process Innovation & Energy Efficiency:</strong> Spearheaded engineering initiatives on thermal and electrical energy optimization across manufacturing lines, cutting utility overhead and minimizing environmental impact.
projects:
