experiences:
    title: Experiences
    info:
      - role: Platform Support Engineer (SRE & Devops)
        time: 2023 - Present
        company: IAG, Christchurch
        details: |
          - Support six core platforms including two AWS-based and four on-prem ecosystems, servicing over 160 microservices.
          - Build and maintain CI/CD pipelines using Jenkins/GitHub Actions to enable safe, automated deployments.
          - Improve platform reliability through synthetic testing, monitoring, and alerting
          - Lead automation initiatives to reduce toil and operational overhead
          - Built a Python LLM-based incident triaging app that automates ticket classification and remediation using log and ticket data.
          - Created a self-service web portal allowing business users to independently resolve data validation issues without contacting support.
          - Manage containers and orchestration (Docker, Kubernetes) in both cloud and on-prem environments.
          - Work with a broad range of technologies including AWS (EC2, S3, DynamoDB, Lambda), Azure Cosmos DB, GDP, Mule API, Kafka, ActiveMQ.
          - Participate in on-call rotations to provide 24/7 support, quickly troubleshooting and resolving critical production issues to minimize downtime.
          - Contribute to knowledge sharing and team growth by mentoring junior staff, delivering automation demos, and peer reviewing platform changes.
      - role: Software Engineer
        time: 2018 - 2023
        company: FIS, Christchurch
        details: |
          - Delivered full-stack features in Agile sprints while actively participating in planning, code reviews, testing, and customer communication.
          - Code on full stack development(Knockout.js with Typescript / .Net, C# / SQL, Oracle) and peer reviewing.
          - Prepare, design and present tech solution at tech approach meetings before a new project / feature kicked off.
          - Write, monitor and maintain unit/integration/ac/UI/performance tests in dev, test and UAT environments.          
          - Excel in triaging queries & issues, troubleshooting and communicating effective workarounds and solutions to customers.
          - Devops experience in executing and maintaining scripts, services, infrastructures(VMs & Docker Containers) for CI/CD and IDP usages.
          - Create and maintain internal plugins/tools for improving development productivity shared by Wiki pages and videos.
          - Mentor juniors and graduates. 
      - role: Software Engineer Intern
        time: 2017 - 2018 Summer
        company: Weta Workshop, Wellington
        details: |
          - Developed and Dockerized Ftrack plugins and a Confluence page add-on to streamline asset management and large-scale 3D model rendering.
          - Created a Python-based desktop tool to visualize data for IT meetings.
