career-profile:
    title: Career Profile
    summary: |
      Senior Platform & Systems Engineer with a multidisciplinary engineering foundation (B.Eng in Chemical Engineering + GDip with Distinction in Computer Science) and 8+ years of software and platform engineering experience. Proven track record of designing resilient backend services (Python, Java, C#/.NET), containerized cloud infrastructure (Kubernetes, AWS, GCP), and automated data/AI platforms. Experienced in partnering directly with domain specialists and operational teams to translate complex technical and data requirements into secure, maintainable self-service solutions. Combines deep analytical problem-solving with hands-on systems reliability, data pipelines (Kafka, BigQuery), and explainable AI enablement.

