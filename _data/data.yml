    intro: ""
    assignments:
      - title: Agentic Incident Triage Engine
        link: "#"
        tagline: 'Architected and built an automated triage engine using Python, FastAPI, and FastMCP on GCP Cloud Run (Vertex AI / Gemini). Engineered secure, parameterized tool endpoints that enable AI agents to safely query enterprise systems (Datadog, Salesforce, Guidewire Cloud, BigQuery) and attach structured diagnostic summaries directly to ServiceNow records within strict safety boundaries.'
      - title: Release Whisperer AI Agent
        link: "#"
        tagline: 'Architected and deployed an AI agent on an internal enterprise platform (ServiceNow API, Atlassian MCP server) to cross-reference release documentation, change tickets, and test evidence. Automatically flags pre-deployment discrepancies such as incorrect build numbers and missing approvals, significantly reducing release risk and audit overhead.'
      - title: Enterprise Self-Service Portal & AI Data Query Engine
        link: "#"
        tagline: 'Engineered an extensible self-service framework enabling authorized business users to independently execute account updates and Guidewire PolicyCenter configuration changes. Integrated enterprise identity systems and ServiceNow APIs for automated entitlement verification. Developed an MCP server translating natural language queries into validated BigQuery SQL to provide audited, self-service data retrieval for operational teams.'
      - title: Incident Classification & MLOps Drift Monitoring Pipeline
        link: "#"
        tagline: 'Built an end-to-end MLOps and data processing pipeline (Python, NumPy, Pandas, Jupyter, MLflow, Docker, Flask, GitHub Actions, Evidently, Grafana) to benchmark and route support tickets instantly. Demonstrated that classical supervised machine learning achieved superior inference speed and accuracy compared to local open-source LLMs. Implemented automated experiment tracking, containerized API serving, CI/CD deployment, and real-time drift monitoring for continuous model reliability.'
