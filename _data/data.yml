career-profile:
    title: Career Profile
    summary: |
      Site Reliability & Software Engineer with 8 years of experience across financial services and enterprise insurance, specializing in developer platforms, CI/CD automation, and production reliability. Proven track record executing GitHub migrations, building and maintaining team-level GitHub repositories and Actions workflows, and delivering self-service platform automation (including MCP servers and automated release gates). Deep background in SRE practices, cloud infrastructure (AWS/GCP, Terraform), and end-to-end observability (OpenTelemetry, Datadog, Splunk) to reduce developer friction and ensure resilience and stability in highly regulated environments.

