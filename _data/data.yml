career-profile:
    title: Career Profile
    summary: |
      Senior Platform Reliability & Software Engineer with a multidisciplinary engineering foundation (B.Eng in Chemical Engineering + GDip with Distinction in Computer Science) and 8+ years of software, platform, and data systems engineering experience. Proven track record of architecting resilient backend services (Python, Java, C#/.NET), containerized cloud environments (Kubernetes, AWS, GCP), and automated AI platforms. Experienced in partnering directly with domain researchers, engineers, and operational stakeholders to translate complex requirements into secure, maintainable self-service solutions. Combines deep analytical problem-solving with hands-on systems reliability, distributed data streams (Kafka, BigQuery), computational performance optimization, and explainable AI enablement.

