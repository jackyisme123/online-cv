experiences:
    title: Working Experiences
    info:
      - role: Platform Engineer & SRE
        time: Aug 2023 - Present
        company: IAG (Insurance Australia Group, ASX Top 50), Christchurch, New Zealand (Hybrid)
        details: |
          - Ops-to-SRE Organizational Transformation: Transitioned legacy operations to an SRE model over 6 months. Partnered with enterprise architects and management to define team roles, aligned stakeholders on Dev/SRE boundaries, and presented roadmaps via slide decks and live demos. Built a software-focused SRE team, coached members through initial PRs, and published runbooks on SRE principles. The team eliminated over 1,000 hours of annual operational toil.
          - Agentic AI Incident Triage: Slow incident investigations and multi-system data gathering caused delayed RCAs and frustrated external brokers. I built an AI agent that automatically pulls and enriches production data, delivers accurate root-cause analysis, provides workarounds, and drafts remediation PRs. This resulted in ~30x faster incident triage to resolution with marked improvements in customer satisfaction.
          - Business Workflow Data Automation: Broker producer code requests relied on fragile spreadsheets and manual database queries, leading to processing delays of hours or days. I built a Python automation engine that parses ServiceNow tickets to auto-generate Gosu code with human approval gates and robust runtime logging. Processing time dropped to under 10 minutes per request without manual database work.
          - AI Governance & Pre-Release Quality: Releases required complex multi-document cross-referencing across teams, creating audit risks. I built a GenAI agent that automatically reviews and cross-validates release documents against data systems, flagging discrepancies with confidence levels and a secondary validator. Peer review time dropped from 30 minutes to 5, ensuring audit-proof sign-offs.
      - role: Full Stack Software Engineer
        time: 2018 - 2023
        company: FIS (Fortune 500 Financial Technology Leader), Christchurch, New Zealand (Hybrid)
        details: |
          - Asset Finance Monolith & Customization: Joined through a graduate rotation program, spending time across customer support, delivery, release management, and DevOps teams before focusing on full-stack feature development. Worked on a massive asset finance monolith handling rating and billing for Tier 1 global clients like HSBC, BMW, and Toyota. Built custom plugins following established patterns to safely deliver diverse client customizations.
          - Algorithm & Database Performance Optimization: Resolved critical performance bottlenecks in a high-volume financial environment. Optimized heavy rating calculations by introducing a lightweight pre-calculation method, slashing execution time from 1 minute to 20 seconds. Resolved challenging concurrency and database indexing issues to ensure reliable, high-speed transaction processing.
          - Quality Engineering & Engineering Enablement: Maintained rigorous platform stability across Dev, Test, and UAT environments using comprehensive test automation suites. Elevated team delivery and onboarding efficiency by creating internal tools, custom automation plugins, and documentation guides, while mentoring junior engineers and graduates.
      - role: Software Engineering Intern
        time: 2017 - 2018 (3 months)
        company: Weta Workshop (Academy Award-Winning Creative Studio), Wellington, New Zealand
        details: |
          - Custom Plugin & Platform Extension: Creative asset pipeline limitations made it difficult to view 3D model files directly within enterprise documentation. To solve this, I developed custom wiki add-ons that rendered and displayed native 3D model formats right inside internal documentation pages.
          - Asset Pipeline Automation: Production tools lacked seamless integration with internal asset tracking systems, causing manual overhead for creative teams. I built container-based plugins and automation scripts to integrate production workflows directly with internal asset management APIs, streamlining asset tracking across projects.
projects:
    title: Projects
    intro: >
    assignments:
      - title: Release Whisperer AI Agent
        link: "#"
        tagline: "Release Whisperer AI Agent: Architected and deployed a GenAI agent on an internal enterprise platform (GenAI, Service Now API, Atlassian MCP server). Cross-references release documentation, change tickets, and test evidence. Automatically flags pre-deployment discrepancies like wrong build numbers and missing approvals, significantly reducing release risk and audit overhead."
      - title: Agentic Incident Triage Engine
        link: "#"
        tagline: "Agentic Incident Triage Engine: Designed an automated triage and data enrichment system using agentic workflows (Gemini, Cloud Run, Vertex AI, vector database). Integrates multi-system APIs (ServiceNow, Datadog, Salesforce, Guidewire Cloud, AWS S3, Google Data Platform) to fetch logs and context, executing automated root-cause analysis and generating draft remediation PRs within strict AI safety boundaries."
      - title: Enterprise Self-Service Portal & AI Data Query Engine
        link: "#"
        tagline: "Enterprise Self-Service Portal & AI Data Query Engine: Engineered an extensible self-service framework enabling authorized business users to independently execute user account changes, producer code updates, and Guidewire PolicyCenter configuration updates. Continuously expanded to handle new business workflows, integrated with enterprise identity systems and ServiceNow APIs for automated entitlement checks, with future plans to introduce AI capabilities for handling complex business data extract requests."
      - title: Incident Classification MLOps Pipeline
        link: "#"
        tagline: "Incident Classification MLOps Pipeline: Built an end-to-end MLOps pipeline (MLflow, Docker, Flask, GitHub Actions, Evidently, Grafana) to benchmark and route support tickets instantly. Proved that classical supervised machine learning achieved superior inference speed and accuracy compared to local open-source LLM models. Implemented automated experiment tracking, containerized API serving, CI/CD deployment, and real-time drift monitoring for continuous model reliability."
