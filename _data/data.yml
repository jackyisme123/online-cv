career-profile:
    title: Career Profile
    summary: |
      Production Support & Platform Engineer with 8+ years of software engineering experience — 5 years as a Full Stack Software Engineer and 3 years as a Platform Support Engineer — specializing in application-layer reliability, internal developer enablement, and enterprise workflow automation.
      Selected as an internal AI Activator, leading AI adoption, responsible AI practices, and agentic workflows across teams.
      Proven track record of architecting API/SDK integrations across hybrid enterprise ecosystems (ServiceNow, Jira, Teams, Salesforce, Google Data Platform, AWS), deploying GenAI tools on internal enterprise platforms (Geni), and enforcing identity governance (IAM/myAccess) and secrets management (HashiCorp Vault).
      Skilled in executing cross-platform developer migrations, engineering self-service portals, designing PII data masking layers, and maintaining robust observability across complex production environments.
      Highly proactive, adaptable to fast-changing technology landscapes, and committed to continuous improvement, architectural thinking, and operational excellence.

