experiences:
    title: Working Experiences
    info:
      - role: Platform Support Engineer
        time: Aug 2023 - Present
        company: IAG, Christchurch (Hybrid)
        details: |
          - Reliability & SRE Transformation: Shifted the team from traditional ops to an SRE model by driving culture change, an engineering-first mindset, and moving away from reactive firefighting toward proactive automation and toil reduction.
          - AIOps Incident Management: Architected and deployed an AI Agent system using loop engineering and agentic workflows to autonomously enrich, triage, and perform root-cause analysis (RCA) on incoming incidents, providing customer workarounds and drafting code fixes/PRs for developer review and merge to accelerate MTTR.
          - Multi-Platform API & Integration Pipelines: Built data and event integration pipelines connecting diverse SaaS, cloud, and legacy ecosystems — ServiceNow, Salesforce (SDK), Oracle (via ODBC), Google Data Platform, AWS — to automate operational syncs and cross-platform workflows.
          - Self-Service & Identity Governance: Engineered an end-to-end self-service portal for internal and business requests submitted via ServiceNow, with automated identity and entitlement verification against enterprise IAM (myAccess) to validate auth and RBAC before provisioning.
          - Observability & Incident Response: Monitored and maintained service health across 160+ production services on Kubernetes using Datadog, Splunk, and New Relic; created custom log dashboards, cut alert noise via synthetic monitoring, and led service-level recovery and deep RCAs during live incidents.
          - Secrets & Access Governance: Enforced security standards using HashiCorp Vault for dynamic secret management and OAuth 2.0/SSO credentials; spearheaded a Bitbucket-to-GitHub migration enforcing multi-tiered org structures and least-privilege RBAC.
          - AI Governance & Risk Mitigation: Designed an AI pre-release review tool using prompt engineering to validate implementation plans and metadata, catching system-level risks such as build mismatches and documentation gaps before production deployment.
          - Enterprise AI Agent Deployment (GitHub Actions assisted): Deployed the "Release Whisperer" AI Agent on an internal GenAI platform to streamline release communications and operational context sharing.
          - Data Privacy & Logging Hygiene: Designed a data masking layer for AI Agent ingress/egress pipelines to prevent sensitive data exposure and created data audit dashboards in Splunk/Datadog.
          - Costs, Tooling & License Optimization: Cut software licensing fees via a Jenkins pipeline optimizing Akamai account usage and eliminated license compliance risk by whitelisting IP ranges, replacing non-compliant tooling with homegrown automations.
          - On-Call & 24/7 Support: Delivered high-availability on-call coverage across production and vendor environments, managing critical incidents, escalation paths, and fast service recovery.
      - role: Full Stack Software Engineer
        time: 2018 - 2023
        company: FIS, Christchurch
        details: |
          - Designed, developed, and supported enterprise applications across client service and delivery teams, building RESTful APIs and modern frontend interfaces (Knockout.js/TypeScript, .Net/C#, SQL, Oracle).
          - Integrated third-party APIs and automated backend CI/CD pipelines, improving application response times and maintainability.
          - Participated in on-call rotations, blameless postmortems, and release engineering, ensuring software updates met strict production readiness standards across QA and UAT environments.
          - Wrote and maintained unit/integration/UI/performance tests across development, test, and UAT environments.
          - Created and maintained internal plugins/tools and automated processes shared via wiki and videos to improve development productivity; mentored juniors and graduates.
      - role: Software Engineer Intern
        time: 2017 - 2018 Summer
        company: Weta Workshop, Wellington
        details: |
          - Developed and Dockerized Ftrack plugins and a Confluence page add-on to streamline asset management and large-scale 3D model rendering.
          - Created a Python-based desktop tool to visualize data for IT meetings.
