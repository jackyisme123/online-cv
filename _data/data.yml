experiences:
    title: Work Experience
    info:
      - role: Platform Reliability Engineer (Automation & AI Activator)
        time: Aug 2023 - Present
        company: IAG (Insurance Australia Group, ASX Top 50), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Agentic AI Incident Triage:</strong> Slow incident investigations created major operational bottlenecks. Ops teams spent hours gathering data across multiple systems before producing accurate RCAs, while Dev teams faced rework due to incomplete handoffs. To address this, I architected and built a functional MVP for an Agentic Incident Triage Engine using agentic workflows (Gemini, Cloud Run, Vertex AI, vector databases). I designed multi-system API integrations (ServiceNow, Datadog, Salesforce, Guidewire Cloud, AWS S3, BigQuery) to fetch logs and context, automating root-cause analysis and generating draft remediation PRs within strict AI safety boundaries. Widely adopted across our operations team to streamline investigations, the MVP demonstrated that multi-system log enrichment accelerates incident triage from hours to minutes, establishing the architectural blueprint for enterprise AI tooling.
          - <strong style="color: #666666;">AI Governance & Pre-Release Quality:</strong> Every release required reviewing four related compliance documents covering technical configurations and governance sign-offs across Ops, Release, and Platform management. Following an external audit that flagged critical compliance risks from unsigned test documentation, I built an AI agent that automatically reviews and cross-validates release documents against enterprise data systems. It detects discrepancies early and generates an HTML report flagging each item with a confidence score while keeping a human in the loop; when confidence is low, a second agent challenges the outcome. Ops review time dropped from 30 minutes to 5 minutes, ensuring consistent compliance with audit and regulatory standards.
          - <strong style="color: #666666;">Business Workflow Data Automation:</strong> Brokers require authorization codes to access core systems, but the legacy workflow required Ops to manually interpret business requests and upload spreadsheets. The same ID could appear across separate spreadsheets updated by both Dev and Ops teams, making errors frequent and difficult to detect without tedious manual database queries. I automated the end-to-end workflow by building a Python engine that translates business requests into Gosu scripts for Ops verification and execution. The solution leverages built-in functions to safely increment public IDs and incorporates comprehensive runtime logging, eliminating manual database queries and reducing processing time from days to under 10 minutes per request.
          - <strong style="color: #666666;">Ops-to-SRE Team Transformation:</strong> Led a 6-month initiative transitioning legacy operations to an SRE model. Researched the latest industry trends and peer practices, partnering with the enterprise architect and career development manager to define the new team's roles and responsibilities. Aligned key stakeholders weekly on clear boundaries between Dev and SRE teams, and presented the roadmap to senior management via executive presentations and live demos. Built a software-focused SRE team, coached members through their first merged pull requests, and published runbooks on SRE principles and AI best practices, eliminating over 1,000 hours of operational toil per year.
      - role: Full Stack Software Engineer
        time: 2018 - 2023
        company: FIS (Fortune 500 Financial Technology Leader), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Asset Finance Monolith & Customization:</strong> Joined through a graduate rotation program, gaining end-to-end exposure across customer support, delivery, release management, and DevOps teams before focusing on full-stack feature development. Co-developed a low-code rule and workflow module for a massive asset finance platform handling rating and billing for Tier 1 global clients (e.g., HSBC, BMW, Toyota), empowering non-technical business analysts and clients to safely configure custom financial workflows and business rules with minimal code changes.
          - <strong style="color: #666666;">Algorithm & Database Performance Optimization:</strong> Resolved critical performance bottlenecks in a high-volume financial environment. Optimized heavy rating calculations by introducing a lightweight pre-calculation method, slashing execution time from 1 minute to 20 seconds. Addressed complex concurrency and database indexing issues to ensure reliable, high-speed transaction processing.
          - <strong style="color: #666666;">Quality Engineering & Engineering Enablement:</strong> Maintained rigorous platform stability across Dev, Test, and UAT environments using comprehensive test automation suites. Elevated team delivery and onboarding efficiency by creating internal tools, custom automation plugins, and documentation guides, while mentoring junior engineers and graduates.
      - role: Software Engineering Intern
        time: 2017 - 2018 (3 months)
        company: Weta Workshop (Academy Award-Winning Creative Studio), Wellington, New Zealand
        details: |
          - <strong style="color: #666666;">Custom Plugin & Platform Extension:</strong> Creative asset pipeline limitations made it difficult to view 3D model files directly within enterprise documentation. To solve this, I developed custom wiki add-ons that rendered and displayed native 3D model formats directly within internal documentation pages.
          - <strong style="color: #666666;">Asset Pipeline Automation:</strong> Production tools lacked seamless integration with internal asset tracking systems, causing manual overhead for creative teams. I built container-based plugins and automation scripts to integrate production workflows directly with internal asset management APIs, streamlining asset tracking across projects.
