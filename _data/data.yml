career-profile:
    title: Career Profile
    summary: |
      Senior Backend & Platform Reliability Engineer with 8+ years of experience architecting high-throughput financial platforms and production GenAI solutions. Combining deep expertise in core banking and asset finance backends (supporting Tier-1 global institutions including HSBC, BMW, and Toyota) with enterprise platform reliability (Guidewire PolicyCenter). Proven track record of developing resilient backend services (Python, Java, C#/.NET), integrating AI agents with enterprise APIs, and designing observable architectures for unpredictable production workloads. Adept at bridging complex distributed systems with trustworthy, explainable AI capabilities.

