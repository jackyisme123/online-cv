experiences:
    title: Working Experiences
    info:
      - role: Senior Site Reliability Engineer
        time: Aug 2023 - Present
        company: IAG (Insurance Australia Group, ASX Top 50), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Ops-to-SRE Cultural & Platform Transformation:</strong> Led a strategic initiative transitioning legacy operations from reactive ticket firefighting into a proactive, software-driven SRE model. Coached team members through PR reviews, CI/CD automation, and runbook-as-code practices, establishing clear operational standards on reliability engineering and observability. This eliminated over 1,000 hours of operational toil per year across the engineering domain.
          - <strong style="color: #666666;">AIOps Incident Triage Engine:</strong>  Addressed slow business-as-usual (BAU) issue resolution caused by fragmented telemetry and isolated systems. Designed and deployed an agentic triage system that pulls context across external telemetry and documentation sources, runs iterative analysis loops to pinpoint root causes, and drafts safe remediation PRs, taking average triage time down from hours to just minutes.
          - <strong style="color: #666666;">Customer Self-Service Portal & Text-to-SQL Automation:</strong> Transformed unstructured business requests (like data extracts, user access, and config updates) into an automated self-service portal. Engineered an AI skill to automatically convert natural language business requests into validated SQL for querying BigQuery data warehouses, while connecting directly with Guidewire PolicyCenter APIs and automatically updating ServiceNow tickets upon completion. Cut request fulfillment time from several business days to under a minute while eliminating manual overhead.
          - <strong style="color: #666666;">Production Oncall Response & Blameless Postmortems:</strong> Maintained 24/7 Tier-1 and 2 on-call coverage and collaborated on Tier-3 incident bridge calls to expedite troubleshooting and resolution for core services. Facilitated blameless postmortems to uncover root causes, establishing action items and partnering with engineering teams to roll out permanent architectural fixes.
          - <strong style="color: #666666;">Production Observability & Telemetry Governance:</strong> Contributed on the enterprise OpenTelemetry implementation across production services to establish unified distributed tracing and metrics. Standardized structured application logging using Structlog to enhance observability and query efficiency in Datadog. Engineered automated redaction filters to intercept and sanitize sensitive PII/PCI data before ingestion, ensuring full regulatory compliance and elevating signal-to-noise ratio during incident triage.
          - <strong style="color: #666666;">Architectural & System Design Collaboration:</strong> Partnered closely with Enterprise Architects, Tech Leads, and product teams on functional and non-functional requirements design reviews, applying Well-Architected Framework pillars to embed reliability, operational excellence, security, and observability into core solution architectures.
      - role: Full Stack Software Engineer
        time: 2018 - 2023
        company: FIS (Fortune 500 Financial Technology Leader), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Asset Finance Monolith & Customization:</strong> Joined through the graduate rotation program, working across support, delivery, release management, and DevOps before stepping into full-stack development. Built and maintained features for our core asset finance platform handling rating and billing for global clients like HSBC, BMW, and Toyota, delivering tailored client customizations through reusable plugins.
          - <strong style="color: #666666;">Algorithm & Database Performance Optimization:</strong> Tackled key performance bottlenecks in a high-volume financial environment. Optimized heavy rating calculations by introducing a lightweight pre-calculation method, cutting execution time from 1 minute down to 20 seconds. Resolved database indexing and concurrency issues to keep transaction processing fast and reliable under load.
          - <strong style="color: #666666;">Quality Engineering & Developer Enablement:</strong> Maintained platform stability across Dev, Test, and UAT environments using automated test suites. Built internal tools, automation plugins, and practical documentation to streamline team delivery and onboarding, while mentoring junior engineers and new graduates.
      - role: Software Engineering Intern
        time: 2017 - 2018 (3 months)
        company: Weta Workshop (Academy Award-Winning Studio), Wellington, New Zealand
        details: |
          - <strong style="color: #666666;">Asset Pipeline Automation:</strong> Creative workflows lacked direct integration with internal asset tracking systems, creating repetitive manual updates for production teams. Developed containerized plugins and Python/Bash automation scripts to connect production tools directly with asset management APIs, eliminating manual tracking and speeding up asset delivery.
          - <strong style="color: #666666;">Internal Tooling & 3D Visualization:</strong> Artists and engineers could not natively preview 3D model files within enterprise documentation. Designed and deployed custom confluence addons that rendered 3D graphic formats directly inside internal docs, bridging communication gaps and simplifying asset reviews across teams.
projects:
    title: Projects
    intro: >
    assignments:
      - title: Ops-to-SRE Cultural & Platform Transformation
        link: "#"
        tagline: 'Transformed team culture from reactive ticket firefighting to proactive reliability engineering. Established runbook-as-code practices, CI/CD operational standards, and observability guardrails, eliminating over 1,000 hours of manual operational toil per year.'
      - title: Agentic Incident Triage Engine
        link: "#"
        tagline: 'Designed a serverless AIOps incident triage pipeline prototyped with Chroma vector DB and scaled in production using GCP Cloud Run, Vertex AI Search, ADK, and Gemini. Integrates telemetry across Datadog, AWS S3, ServiceNow, and Google Data Platform. Automatically ingests distributed logs, performs semantic retrieval and real-time root-cause analysis (RCA), and drafts remediation PRs to compress MTTR from hours to minutes.'
      - title: Customer Self-Service Portal & Text-to-SQL Automation
        link: "#"
        tagline: 'Built an automated self-service portal in ServiceNow integrated with Guidewire PolicyCenter APIs and BigQuery via secure webhook pipelines. Developed an automated Text-to-SQL AI skill translating natural language business inquiries into BigQuery SQL for instant data extraction, slashing request fulfillment time from days to under 1 minute.'
      - title: "Release Whisperer: Documentation Quality Gating Agent"
        link: "#"
        tagline: 'Architected an automated release verification agent integrated with ServiceNow APIs and Atlassian MCP Server. Cross-references release artifacts, change records, and test evidence against live systems. Flags discrepancies and enforces production guardrails to eliminate audit risks.'
      - title: GitHub Migration
        link: "#"
        tagline: 'Led the migration from legacy Bitbucket and Jenkins to GitHub Enterprise. Successfully migrated code repositories, converted Jenkins CI/CD pipelines to reusable GitHub Actions workflows, and structured team hierarchies with least-privilege access to safely decommission legacy infrastructure.'
      - title: Incident Classification MLOps Pipeline (Side Project)
        link: "#"
        tagline: 'Built an end-to-end MLOps pipeline (MLflow, Docker, GitHub Actions, Evidently, Grafana) to compare classical machine learning against local LLMs (Ollama / Llama) for support ticket classification. Evaluated latency and accuracy trade-offs while implementing automated experiment tracking, containerized inference, and real-time data drift monitoring.'
