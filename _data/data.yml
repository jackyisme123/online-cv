experiences:
    title: Work Experience
    info:
      - role: Senior Platform Reliability & Software Engineer
        time: Aug 2023 - Present
        company: IAG (Insurance Australia Group, ASX Top 50), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Distributed Java Platform Engineering, RCA & Bug Fixing:</strong> Support core enterprise backend platform (Java/Gosu). Perform deep root-cause analysis on production incidents, reproduce edge-case defects, and deliver Java backend fixes and architectural enhancements. Investigate backend logs, database queries, and API integrations to resolve complex data lifecycle and distributed transaction errors.
          - <strong style="color: #666666;">Reliability, Observability & Data Pipelines:</strong> Strengthen backend reliability and visibility across unpredictable enterprise workloads by configuring full-stack observability and distributed tracing. Monitor and troubleshoot distributed microservices, Kubernetes pod metrics and lifecycle, and data pipeline health across Kafka event streams and BigQuery data stores.
          - <strong style="color: #666666;">AI Activator & Technical Sparring Partner:</strong> Serve as an internal AI Activator and technical sparring partner bridging enterprise technical strategy with practical squad adoption. Consult directly with cross-functional and domain stakeholders to translate evolving, ambiguous requirements into reusable AI tools, standardized integration patterns, and developer automation. Champion engineering best practices across internal AI initiatives, including the production Agentic Incident Triage Engine and Release Whisperer.
          - <strong style="color: #666666;">Self-Service Tooling, Explainability & Toil Reduction:</strong> Partner closely with domain users and technical teams to translate repetitive operational and data inquiries into automated, explainable self-service workflows (including an agentic Text-to-SQL data retrieval engine on BigQuery). Author Python and PowerShell automation scripts and troubleshooting runbooks, eliminating over 1,000 hours of manual operational toil annually.
      - role: Full Stack Software Engineer (Core Computational & Transactional Backend)
        time: 2018 - 2023
        company: FIS (Fortune 500 Financial Technology Leader), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Core Platform & Distributed Systems Engineering:</strong> Engineered mission-critical backend modules and business logic (C#/.NET) for Tier-1 global institutions (HSBC, BMW Finance, Toyota Finance), ensuring strict transactional consistency, high availability, and regulatory compliance.
          - <strong style="color: #666666;">Complex Troubleshooting, RCA & Production Patches:</strong> Served as an escalation point for mission-critical client incidents and edge cases. Investigated complex system failures across distributed transaction flows, reproduced multi-threaded bugs in isolated environments, and implemented robust code fixes and production patches.
          - <strong style="color: #666666;">Performance Optimization & Computational Latency:</strong> Diagnosed and resolved severe concurrency bottlenecks, database deadlocks, and slow query executions in high-throughput transactional environments. Re-architected computationally heavy rating calculations with pre-calculation caching and query optimization, reducing latency from 60 seconds to 20 seconds.
          - <strong style="color: #666666;">Extensible Workflow Engine & Domain Enablement:</strong> Co-developed an extensible business rules and workflow engine within the core platform, allowing domain operations teams to configure custom business logic without code deployments, significantly reducing support ticket volumes.
      - role: Software Engineering Intern
        time: 2017 - 2018 (3 months)
        company: Weta Workshop (Academy Award-Winning Creative Studio), Wellington, New Zealand
        details: |
          - <strong style="color: #666666;">Asset Pipeline Automation:</strong> Built containerized plugins to connect internal production creative tools directly with asset tracking APIs, eliminating manual asset entry and repetitive operational overhead.
          - <strong style="color: #666666;">Internal Tooling & Specialized Data Extensions:</strong> Developed custom Confluence wiki extensions that natively rendered 3D model formats within internal documentation pages, bridging the gap between specialized domain specialists and technical systems.
      - role: Working Holiday & International Transition
        time: 2015 - 2016
        company: New Zealand
        details: |
          - <strong style="color: #666666;">International Transition & Language Immersion:</strong> Relocated to New Zealand on a Working Holiday visa, developing professional English fluency and cross-cultural adaptability while preparing for an academic transition into Computer Science.
      - role: Chemical Engineer (Process Telemetry, Data Acquisition & Quality Engineering)
        time: 2008 - 2014
        company: LG Chem (Global Fortune 500 Chemical & Materials Manufacturer), Tianjin, China
        details: |
          - <strong style="color: #666666;">Sensor Telemetry & Reaction Optimization:</strong> Extracted, analyzed, and correlated operational telemetry from Honeywell PLCs, industrial sensors, and chemical laboratory assay data to model and calculate optimal temperature, pressure, and catalyst parameters, directly improving production yields and chemical consistency.
          - <strong style="color: #666666;">Statistical Quality Control & Root-Cause Analysis:</strong> Applied Six Sigma methodologies, statistical process control, and rigorous root-cause investigation across laboratory and manufacturing datasets to eliminate batch defects and enforce quality standards.
          - <strong style="color: #666666;">Plant Turnaround & Operational Engineering:</strong> Directed cross-functional engineering and maintenance teams during 15 to 20 day full-facility shutdowns for comprehensive preventive inspections and equipment overhauls with zero safety incidents.
          - <strong style="color: #666666;">Process Innovation & Resource Efficiency:</strong> Spearheaded engineering initiatives on thermal and electrical energy optimization across manufacturing lines, cutting utility overhead and minimizing environmental impact.
projects:
