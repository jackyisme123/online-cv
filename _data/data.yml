experiences:
    title: Working Experiences
    info:
      - role: Platform Engineer & SRE
        time: Aug 2023 - Present
        company: IAG, Christchurch, New Zealand (Hybrid)
        details: |
          - Ops to SRE Transformation: Led the shift from traditional ops to an SRE model by driving cultural alignment, an engineering-first mindset, and moving the team from reactive firefighting to proactive automation and toil reduction, reclaiming ~1,000 hours per year through the automation I built and rolled out across the team.
          - Agentic Incident Management (AIOps): Architected an AI Agent system using loop engineering and agentic workflows to autonomously enrich, triage, and perform RCA on incoming incidents, providing customer workarounds and drafting code fixes/PRs to accelerate MTTR. Local MVP validated with GitHub Copilot; architecture review passed and production implementation with Gemini and Cloud Run is underway. Impact: ~30x faster incident triage to resolution.
          - Guidewire Cloud Ecosystem Ownership: Owned reliability and observability architecture for Guidewire Cloud Policy Center, driving end-to-end incident management, deep RCAs, and direct code fixes while leveraging automated telemetry and New Relic synthetic monitoring to track availability, cut alert noise, and align Datadog dashboards with release readiness.
          - Release Whisperer AI Agent: Architected and deployed a specialized GenAI agent on our internal GenAI platform to automate release communication synthesis, operational context sharing, and cross-team deployment updates, saving roughly half an hour per release.
          - Service-Level On-Call & Incident Response: Delivered high-availability on-call coverage across 160+ production services in hybrid cloud environments, managing critical incidents, escalation paths, and rapid service recovery.
          - AI Governance & Risk Mitigation: Designed an AI pre-release review tool using prompt engineering to validate implementation plans and metadata, catching system-level risks like build mismatches and documentation gaps before production deployment.
          - GitHub Migration & Organizational Design: Spearheaded the Bitbucket-to-GitHub migration, designing multi-tiered org architectures, team structures, and enforcing strict least-privilege access across organizational repositories.
          - Cost, Tooling & License Optimization: Cut software licensing fees via a Jenkins pipeline optimizing Akamai account usage and eliminated commercial license compliance risks by whitelisting S3 IPs via Netskope, recovering hundreds of dollars per year in licensing with compliant WinSCP and automated transfers replacing non-compliant S3 tools.
          - Coaching, Mentoring & Knowledge Sharing: Serve as one of IAG's AI Activators, coaching colleagues on AI adoption, prompt engineering, and tooling; mentor on SRE practices and foundations as lead of the ops-to-SRE transformation; and share production and cloud engineering knowledge built across the Guidewire Policy Center and AWS programs through demos, documentation, and postmortems.
      - role: Full Stack Software Engineer
        time: 2018 - 2023
        company: FIS, Christchurch, New Zealand (Hybrid)
        details: |
          - Full Stack Software Engineer on an enterprise finance and accounting platform, delivered to international banks and financial service providers. Designed and built RESTful APIs and modern front-end interfaces (Knockout.js/TypeScript, .NET/C#, SQL, Oracle) across the full lifecycle, from requirements and architecture through to production support.
          - Led technical analysis, estimation, and delivery of complex client and regulatory requirements, translating business and compliance needs into robust, scalable software while ensuring strict financial data accuracy and audit-readiness.
          - Architectured performance and scalability improvements and integrated third-party SaaS APIs and backend CI/CD pipelines, improving application response times, maintainability, and deployment speed across global deployments.
          - Built and maintained comprehensive unit, integration, UI, and performance test suites across development, test, and UAT environments, applying analytical, critical thinking to quality engineering and release readiness.
          - Developed internal plugins, tools, and developer productivity automations shared via internal wikis and video documentation; mentored junior engineers and graduates and raised capability across the wider team.
projects:
    title: Projects
    intro: >
    assignments:
      - title: Agentic Incident Triage (Architecture & MVP)
        link: "#"
        tagline: "Designed an automated triage system using agentic workflows to parse incident webhooks, execute automated root-cause analysis (RCA), and generate draft remediation PRs. Built and validated a local MVP with GitHub Copilot; architecture review passed and production implementation with Gemini and Cloud Run is underway."
      - title: Release Whisperer AI Agent
        link: "#"
        tagline: "Architected and deployed a specialized GenAI agent on an internal enterprise platform (Geni) to automate release communication synthesis, operational context sharing, and cross-team deployment updates."
      - title: Incident Classification MLOps Pipeline (Side Project)
        link: "#"
        tagline: "Built an end-to-end MLOps pipeline to evaluate ticket classification approaches. Benchmarked traditional supervised ML models against local LLM prompts (Ollama / early LLaMA 3), finding classic ML superior for structured routing latency. Implemented model tracking (MLflow), containerized API serving (Docker/Flask), CI/CD pipelines (GitHub Actions), and drift monitoring (Evidently, Grafana, Datadog)."
      - title: Enterprise Self-Service Portal
        link: "#"
        tagline: "Engineered a self-service application enabling business users to resolve data issues independently. Integrated with ServiceNow APIs and enterprise IAM (myAccess) to enforce automated identity, entitlement, and RBAC security checks prior to service execution."
