    summary: |
      Senior Platform Engineer blending 5 years of full-stack software development with 3 years of SRE expertise, currently serving as an internal AI Activator at IAG. Proven track record of delivering end-to-end solutions by architecting automation frameworks and AI agents across local, cloud, and on-premises environments to eliminate business operational toil. Partner with cross-functional stakeholders to translate complex corporate workflows into self-service applications and resilient platform architectures.

