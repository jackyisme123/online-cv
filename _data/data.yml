experiences:
    title: Working Experiences
    info:
      - role: Production Support Engineer / Platform Support Engineer
        time: Aug 2023 - Present
        company: IAG, Christchurch, New Zealand (Hybrid)
        details: |
          - AI Activation & Enterprise Enablement: Selected as one of IAG's AI Activators, guiding cross-functional teams in building AI projects—from ideation and responsible AI governance to delivery—championing AI adoption and enabling AI-enabled capabilities across the organization.
          - Enterprise AI Agent Deployment (Release Whisperer): Architected and deployed the "Release Whisperer" AI Agent onto IAG's internal GenAI platform (Geni) utilizing GitHub Actions pipelines, streamlining release communications, operational context sharing, and cross-team deployment updates.
          - AIOps Incident Triage Architecture & Prototyping: Completed end-to-end architecture design (currently under formal architecture review) and built a local MVP for an autonomous AI Triage Agent. Utilized loop engineering and agentic workflows to parse incoming incident webhooks, execute automated root-cause analysis (RCA), and draft code fixes/PRs for developer review (architected for cloud deployment on GCP).
          - AI Governance & Risk Mitigation: Designed an AI pre-release review tool using prompt engineering and metadata validation, catching system-level risks and documentation gaps prior to production deployment.
          - Data Privacy & Logging Hygiene: Designed a PII data masking layer for AI Agent ingress/egress pipelines to prevent sensitive data exposure and built data audit dashboards in Splunk and Datadog for strict compliance.
          - Automated Self-Service & Identity Governance: Engineered an end-to-end self-service portal for internal and business requests submitted via ServiceNow, integrating automated identity and entitlement verification against enterprise IAM (myAccess) to validate auth and RBAC prior to provisioning.
          - Multi-Platform API & Integration Pipelines: Built data and event integration pipelines connecting diverse SaaS, cloud, and legacy ecosystems—including ServiceNow, Salesforce (SDK), Oracle (via ODBC), Google Data Platform, AWS, and Azure—to automate operational syncs and cross-platform workflows.
          - Observability & Incident Response: Monitored and maintained service health across 160+ production services on Kubernetes using Datadog, Splunk, and New Relic; created custom log dashboards, cut alert noise via synthetic monitoring, and led service-level recovery and deep RCAs during live incidents.
          - Secrets & Access Governance: Enforced security standards using HashiCorp Vault for dynamic secret management and OAuth 2.0/SSO credentials; spearheaded a Bitbucket-to-GitHub migration enforcing multi-tiered org structures and least-privilege RBAC.
          - Reliability & SRE Transformation: Shifted the team from traditional ops to an SRE model by driving culture change, an engineering-first mindset, and moving away from reactive firefighting toward proactive automation and toil reduction.
          - Costs, Tooling & License Optimization: Cut software licensing fees via a Jenkins pipeline optimizing account usage and eliminated license compliance risk by allowing IP ranges, replacing non-compliant tooling with homegrown automations.
          - On-Call & 24/7 Support: Delivered high-availability on-call coverage across production and vendor environments, managing critical incidents, escalation paths, and fast service recovery.
      - role: Full Stack Software Engineer
        time: 2018 - 2023
        company: FIS, Christchurch, New Zealand
        details: |
          - Designed, developed, and supported enterprise applications across client service and delivery teams, building RESTful APIs and modern frontend interfaces (Knockout.js/TypeScript, .NET/C#, SQL, Oracle).
          - Integrated third-party APIs and automated backend CI/CD pipelines, improving application response times, system maintainability, and deployment speed.
          - Authored and maintained comprehensive unit, integration, UI, and performance test suites across development, test, and UAT environments.
          - Participated in on-call rotations, blameless postmortems, and release engineering, ensuring software updates met strict production readiness standards across QA and UAT environments.
          - Engineered internal plugins, tools, and developer productivity automations shared via internal wikis and video documentation; mentored junior engineers and graduates.
projects:
    title: Projects
    intro: >
    assignments:
      - title: Agentic Incident Triage (Architecture & MVP)
        link: "#"
        tagline: "Designed an automated triage system using Python and agentic workflows (LLaMA / loop engineering) to parse incident webhooks and logs, perform automated root-cause analysis (RCA), and generate draft remediation PRs. Containerized with Docker, automated via GitHub Actions CI/CD, with cloud deployment architecture completed and under formal review."
      - title: Release Whisperer AI Agent
        link: "#"
        tagline: "Architected and deployed a specialized GenAI agent on an internal enterprise platform (Geni) to automate release communication synthesis, operational context sharing, and cross-team deployment updates."
      - title: Incident Classification MLOps Pipeline (Side Project)
        link: "#"
        tagline: "Built an end-to-end MLOps pipeline to evaluate ticket classification approaches. Benchmarked traditional supervised ML models against local LLM prompts (Ollama / early LLaMA 3), finding classic ML superior for structured routing latency. Implemented model tracking (MLflow), containerized API serving (Docker/Flask), CI/CD pipelines (GitHub Actions), and drift monitoring (Evidently, Grafana, Datadog)."
      - title: Enterprise Self-Service Portal
        link: "#"
        tagline: "Engineered a self-service application enabling business users to resolve data issues independently. Integrated with ServiceNow APIs and enterprise IAM (myAccess) to enforce automated identity, entitlement, and RBAC security checks prior to service execution."
