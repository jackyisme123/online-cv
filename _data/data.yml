experiences:
    title: Work Experience
    info:
      - role: Site Reliability & Operations Support Engineer
        time: Aug 2023 - Present
        company: IAG (Insurance Australia Group, ASX Top 50), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Multi-Platform Modernization:</strong> Supported enterprise platform modernization, transitioning multiple heritage AU/NZ insurance systems into consolidated cloud platforms. Provided Tier-3 operational support across commercial Guidewire PolicyCenter (SaaS/Cloud, maintaining customized Java/Gosu code and integrations alongside vendor infrastructure) and retail AWS cloud-native policy and customer portals. Performed deep root-cause analysis, reproduced complex edge-case defects in non-production environments, and delivered backend bug fixes for critical policy lifecycle and transaction errors.
          - <strong style="color: #666666;">Reliability & Observability:</strong> Strengthened backend reliability and visibility across unpredictable enterprise workloads by configuring full-stack observability (Datadog, New Relic, Splunk, Grafana) and OpenTelemetry distributed tracing. Analyzed API payloads, microservice latencies, and Kubernetes pod metrics to establish proactive SLO alerts and safeguard system uptime.
          - <strong style="color: #666666;">AI Activator & Team Enablement:</strong> Served as an internal AI Activator bridging enterprise AI strategy with practical squad adoption. Built reusable AI skills, standardized integration patterns (FastMCP), and developer tooling while mentoring team members to adopt GenAI safely and efficiently. Championed engineering best practices to deliver production AI initiatives, enabling automated cross-system diagnostics and triage.
          - <strong style="color: #666666;">On-Call Incident Triage:</strong> Handled rotating 24/7 on-call callouts to rapidly troubleshoot and isolate high-priority production incidents across firewalls (Illumio), networking (F5 load balancers), IAM permissions, core backend systems, and external service dependencies. Stepped into the Major Incident Management bridge role to coordinate cross-functional teams (infrastructure, security, platform, and custom support squads) for rapid service restoration.
          - <strong style="color: #666666;">Ops-to-SRE Cultural Transition:</strong> Spearheaded a team initiative transitioning legacy operations into an engineering-led SRE model. Established clear team boundaries, supportability standards, and code review practices for operational tooling. Engineered "runbook-as-code" auto-remediations alongside a wide suite of operational automations, cumulatively eliminating over 1,000 hours of manual toil per year.
      - role: Software Engineer & Customer Engineer
        time: 2018 - 2023
        company: FIS (Fortune 500 Financial Technology Leader), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Mission-Critical Tier-3 Client Escalations:</strong> Served as Tier-3 technical escalation authority for Tier-1 global institutions (HSBC, BMW Finance, Toyota Finance). Investigated high-severity production outages across distributed transaction flows, reproduced complex multi-threaded concurrency bugs in dedicated lab environments, and engineered verified production patches or data fix script under strict enterprise SLAs.
          - <strong style="color: #666666;">Distributed System Performance:</strong> Diagnosed and resolved severe database deadlocks, socket connection timeouts, and computational concurrency bottlenecks across high-throughput transactional backends. Re-architected batch rating engines with caching and query optimization, slashing processing latency from 60 seconds to 20 seconds.
          - <strong style="color: #666666;">Self-Service Rule Engine:</strong> Co-developed an extensible workflow and business rules engine within the core platform, allowing client support and operations squads to configure dynamic business rules without code deployments, significantly deflecting recurring support tickets.
          - <strong style="color: #666666;">Root Cause Analysis:</strong> Authored comprehensive post-incident reviews and diagnostic guides for client engineering and internal engineering teams. Conducted technical debriefs translating low-level crash dumps and transactional logs into actionable preventative measures for core product development.
      - role: Software Engineering Intern
        time: 2017 - 2018 (3 months)
        company: Weta Workshop (Academy Award-Winning Creative Studio), Wellington, New Zealand
        details: |
          - <strong style="color: #666666;">Asset Pipeline Automation:</strong> Built containerized plugins to connect internal production creative tools directly with asset tracking APIs, eliminating manual asset entry and repetitive operational overhead.
          - <strong style="color: #666666;">Internal Tooling & Specialized Data Extensions:</strong> Developed custom Confluence wiki extensions that natively rendered 3D model formats within internal documentation pages, bridging the gap between specialized domain specialists and technical systems.
      - role: Working Holiday & International Transition
        time: 2015 - 2016
        company: New Zealand
        details: |
          - <strong style="color: #666666;">International Transition & Language Immersion:</strong> Relocated to New Zealand on a Working Holiday visa, developing professional English fluency and cross-cultural adaptability while preparing for an academic transition into Computer Science.
      - role: Chemical Engineer (Process & Quality Engineering)
        time: 2008 - 2014
        company: LG Chem (Global Fortune 500 Chemical & Materials Manufacturer), Tianjin, China
        details: |
          - <strong style="color: #666666;">Telemetry Analysis & Process Optimization:</strong> Analyzed operational data and sensor telemetry from industrial control systems to optimize operating parameters, enhance yield, and improve energy efficiency.
          - <strong style="color: #666666;">Root-Cause Analysis & Turnaround Operations:</strong> Applied statistical quality control (Six Sigma) and root-cause diagnostics to eliminate batch defects; coordinated cross-functional maintenance teams during critical plant turnarounds with zero safety incidents.
