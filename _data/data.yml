career-profile:
    title: Career Profile
    summary: |
      Site Reliability Engineer with 8+ years of combined engineering experience, including 5 years of full-stack software engineering at FIS building mission-critical financial platforms, and currently supporting core enterprise insurance platforms at IAG (GPNZ_OPS_SUPPORT & COMMERCIAL_POLICYCENTER_SUPPORT). Spearheaded our team's transformation from reactive operations to a proactive SRE model, establishing runbooks, observability standards, and automations that eliminate over 1,000 hours of operational toil annually. Operating as an internal AI Activator, I partner directly with architecture, operations, development, and other business teams to translate recurring incidents, manual reviews, and operational bottlenecks into reliable automations and agentic workflows. Excited to bring strong systems thinking, production reliability rigor, and hands-on AI enablement to RIA's Agentic Software Engineering practice.

