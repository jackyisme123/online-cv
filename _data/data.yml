    summary: |
      Site Reliability, Operations Support and Software Engineer with 8+ years of experience supporting mission-critical distributed systems and enterprise platform modernization across cloud and enterprise environments. Combines strong cross-functional engineering collaboration, stakeholder management, and customer-facing support with technical leadership and team mentorship. Deep expertise in advanced troubleshooting and root cause analysis, supportability engineering, and continuous operational improvement. Backed by solid software development and automation scripting capabilities, with hands-on experience designing AI and agentic workflows to eliminate toil and accelerate production incident resolution.

