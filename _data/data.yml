career-profile:
    title: Career Profile
    summary: |
      Platform Reliability & Operations Engineer with extensive experience supporting enterprise cloud platforms, SaaS systems, and shared GenAI solutions. Combines direct user support and clear technical communication with deep investigation across cloud & VM infrastructure, APIs, authentication, and distributed microservices. Proven track record managing operational queues, troubleshooting incidents using full-stack observability (Datadog, NewRelic, Splunk, Grafana, OpenTelemetry), reproducing bugs with actionable evidence, and delivering production bug fixes. Experienced building production AI agents (FastMCP, RAG, Vertex AI) and authoring Python/PowerShell automations to eliminate recurring support toil and drive GenAI platform adoption.

