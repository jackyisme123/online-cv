experiences:
    title: Work Experience
    info:
      - role: Platform Reliability Engineer (Automation & AI Activator)
        time: Aug 2023 - Present
        company: IAG (Insurance Australia Group, ASX Top 50), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Incident Triage & Production Support:</strong> Lead end-to-end incident investigation and application support across enterprise core systems (Guidewire Cloud). Rapidly triage issues, applying direct code/data remediation for policy domain faults or coordinating precise handoffs to specialized billing, pricing, under writing and document teams to prevent SLA breaches and protect MTTR.
          - <strong style="color: #666666;">AI & Automation Solutions:</strong> Act as an internal automation activator, turning manual business requests and operational bottlenecks into software solutions—ranging from deterministic data-processing engines to production-tested GenAI agents (FastMCP, RAG & LLM Wiki architectures) for incident triage and release compliance.
          - <strong style="color: #666666;">Enterprise Observability & Alerting:</strong> Build and maintain full-stack observability dashboards (Datadog) and synthetic monitors; define proactive SLO/SLA alerting to detect upstream service anomalies before they impact customers.
          - <strong style="color: #666666;">Release Governance & On-Call Operations:</strong> Manage scheduled production deployments, participate in primary 24/7 on-call rotations, and enforce automated pre-release checks to ensure zero-defect deployments under strict regulatory compliance.
          - <strong style="color: #666666;">Ops-to-SRE Cultural Transition:</strong> Spearheaded a team initiative transitioning legacy operations into an engineering-led SRE model; established clear team boundaries, runbooks, and code review practices, eliminating over 1,000 hours of manual toil per year.
      - role: Full Stack Software Engineer
        time: 2018 - 2023
        company: FIS (Fortune 500 Financial Technology Leader), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Asset Finance Monolith & Customization:</strong> Joined through a graduate rotation program, gaining end-to-end exposure across customer support, delivery, release management, and DevOps teams before focusing on full-stack feature development. Co-developed a low-code rule and workflow module for a massive asset finance platform handling rating and billing for Tier 1 global clients (e.g., HSBC, BMW, Toyota), empowering non-technical business analysts and clients to safely configure custom financial workflows and business rules with minimal code changes.
          - <strong style="color: #666666;">Algorithm & Database Performance Optimization:</strong> Resolved critical performance bottlenecks in a high-volume financial environment. Optimized heavy rating calculations by introducing a lightweight pre-calculation method, slashing execution time from 1 minute to 20 seconds. Addressed complex concurrency and database indexing issues to ensure reliable, high-speed transaction processing.
          - <strong style="color: #666666;">Quality Engineering & Engineering Enablement:</strong> Maintained rigorous platform stability across Dev, Test, and UAT environments using comprehensive test automation suites. Elevated team delivery and onboarding efficiency by creating internal tools, custom automation plugins, and documentation guides, while mentoring junior engineers and graduates.
      - role: Software Engineering Intern
        time: 2017 - 2018 (3 months)
        company: Weta Workshop (Academy Award-Winning Creative Studio), Wellington, New Zealand
        details: |
          - <strong style="color: #666666;">Custom Plugin & Platform Extension:</strong> Creative asset pipeline limitations made it difficult to view 3D model files directly within enterprise documentation. To solve this, I developed custom wiki add-ons that rendered and displayed native 3D model formats directly within internal documentation pages.
          - <strong style="color: #666666;">Asset Pipeline Automation:</strong> Production tools lacked seamless integration with internal asset tracking systems, causing manual overhead for creative teams. I built container-based plugins and automation scripts to integrate production workflows directly with internal asset management APIs, streamlining asset tracking across projects.
      - role: Working Holiday & International Transition
        time: 2015 - 2016
        company: New Zealand
        details: |
          - <strong style="color: #666666;">International Transition & Language Immersion:</strong> Relocated to New Zealand on a Working Holiday visa, developing professional English fluency and cross-cultural adaptability while preparing for academic transition into Computer Science.
      - role: Chemical Engineer
        time: 2008 - 2014
        company: LG Chem (Global Fortune 500 Chemical & Materials Manufacturer), Tianjin, China
        details: |
          - <strong style="color: #666666;">Process Innovation & Energy Efficiency:</strong> Spearheaded engineering initiatives focused on emissions reduction and thermal/power energy optimization across manufacturing lines, cutting utility overhead and minimizing environmental impact.
          - <strong style="color: #666666;">Six Sigma Quality Engineering:</strong> Applied Six Sigma methodologies, root-cause analyses, and statistical process control (SPC) to eliminate batch defects, enhance production yields, and enforce strict quality assurance protocols.
          - <strong style="color: #666666;">Plant Turnaround & Maintenance Leadership:</strong> Orchestrated end-to-end planning and execution for major annual plant turnarounds, leading cross-functional engineering teams during 15–20 day full facility shutdowns for comprehensive equipment overhauls, pipeline cleaning, and preventive inspections with zero safety incidents.
          - <strong style="color: #666666;">Cost Center & Financial Optimization:</strong> Partnered directly with the finance department to model operational cost centers, track raw material consumption against production quotas, and identify high-impact cost-saving opportunities across manufacturing operations.
projects:
    title: Projects
    intro: ""
    assignments:
      - title: Release Whisperer AI Agent
        link: "#"
        tagline: 'Architected and deployed a GenAI agent on an internal enterprise platform (GenAI, ServiceNow API, Atlassian MCP server) to cross-reference release documentation, change tickets, and test evidence. Automatically flags pre-deployment discrepancies such as incorrect build numbers and missing approvals, significantly reducing release risk and audit overhead.'
      - title: Agentic Incident Triage Engine
        link: "#"
        tagline: 'Designed an automated triage and operational enrichment system using agentic workflows (Gemini, Cloud Run, Vertex AI, vector databases). Engineered an internal FastMCP server integrated with developer tooling to fetch and update live ServiceNow incident records, while orchestrating multi-system APIs (Datadog, Salesforce, Guidewire Cloud, AWS S3, BigQuery) to accelerate root-cause analysis within strict AI safety boundaries.'
      - title: Enterprise Self-Service Portal & AI Data Query Engine
        link: "#"
        tagline: 'Engineered an extensible self-service framework enabling authorized business users to independently execute user account changes, commission updates, and Guidewire PolicyCenter configuration updates. Integrated with enterprise identity systems and ServiceNow APIs for automated entitlement checks. Built an MCP server to convert natural language queries into BigQuery SQL for complex business data extraction requests, with continuous iterations underway as part of future roadmap plans.'
      - title: Incident Classification & MLOps Drift Monitoring Pipeline
        link: "#"
        tagline: 'Built an end-to-end MLOps pipeline (MLflow, Docker, Flask, GitHub Actions, Evidently, Grafana) to benchmark and route support tickets instantly. Proved that classical supervised machine learning achieved superior inference speed and accuracy compared to local open-source LLMs. Implemented automated experiment tracking, containerized API serving, CI/CD deployment, and real-time drift monitoring for continuous model reliability.'
