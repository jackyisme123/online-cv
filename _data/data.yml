experiences:
    title: Working Experiences
    info:
      - role: Platform Engineer & SRE
        time: Aug 2023 - Present
        company: IAG (Insurance Australia Group, ASX Top 50), Christchurch, New Zealand (Hybrid)
        details: |
          - Ops-to-SRE Organizational Transformation: Led a 6-month initiative transitioning legacy operations to an SRE model through gap/risk assessments and clear DevOps vs. SRE boundaries, building a software-focused SRE team that eliminated over 1,000 hours of operational toil per year.
          - Agentic AI Incident Triage (GCP, in rollout): Architected and locally validated an autonomous AI Agent using RAG and loop engineering, delivering ~30x faster incident triage to resolution; passed enterprise architecture review for production rollout on GCP (Gemini, Cloud Run, Vertex AI, Google ADK). Integrated RAG search across Guidewire API, Datadog, Bitbucket, ServiceNow, Salesforce, and Atlassian MCP for enriched analysis, high-accuracy RCAs, customer workarounds, and automated Jira tickets with draft code fixes within strict AI safety boundaries.
          - Business Workflow Data Automation: Cut processing time from several hours (or days during complex troubleshooting) down to under 10 minutes per request with a Python engine that parses ServiceNow tickets to auto-generate Gosu database scripts. Removed manual public-ID mapping and data corruption risks, while embedding structured logging in Gosu scripts to enable rapid operational troubleshooting.
          - Async Queue Auto-Remediation: Engineered automated incident conversion and self-healing for broker portal queues using keyword-driven Runbook as Code, with atomic transaction rollback safety and workload visibility for management.
          - AI Governance & Pre-Release Quality: Built an AI-powered pre-release review tool using prompt engineering to catch build mismatches and documentation gaps before deployment, plus an agent triaging vulnerabilities and Dependabot alerts.
          - Platform Reliability, Security & Cost: Secured 160+ production services with full-stack telemetry (New Relic, Datadog) and RBAC migrations, while cutting licensing fees via Jenkins pipelines for Akamai usage and Netskope network-layer IP whitelisting for compliant S3 transfers.
      - role: Full Stack Software Engineer
        time: 2018 - 2023
        company: FIS (Fortune 500 Financial Technology Leader), Christchurch, New Zealand (Hybrid)
        details: |
          - Enterprise Financial Platform Development: Engineered end-to-end RESTful, GraphQL, and SOAP APIs and modern web applications (TypeScript, Knockout.js, .NET/C#, SQL, Oracle) for mission-critical banking and accounting systems deployed to Tier 1 global financial institutions.
          - Regulatory Compliance & Architecture Translation: Led technical analysis, estimation, and implementation of complex international financial regulations and client requirements, translating business logic into audit-ready, high-accuracy software architectures.
          - System Performance & Global Scale Optimization: Boosted application response times and deployment velocity across global deployments by refactoring legacy database workflows, integrating third-party SaaS APIs, and automating CI/CD pipelines.
          - Quality Engineering & Release Readiness: Built comprehensive unit, integration, UI, and performance test automation suites across Dev, Test, and UAT environments, ensuring rigorous platform stability prior to production releases.
          - Developer Productivity & Engineering Mentorship: Created internal tools, custom plugins, and developer automation shared via internal documentation and video guides; mentored junior engineers and graduates to raise overall team delivery capabilities.
      - role: Software Engineering Intern
        time: 2017 - 2018 (3 months)
        company: Weta Workshop (Academy Award-Winning Creative Studio), Wellington, New Zealand
        details: |
          - Custom Plugin & Platform Extension: Solved creative asset pipeline limitations by developing custom Confluence add-ons (Vue.js, Node.js) to render and display native 3D model file formats directly within enterprise wiki documentation.
          - Asset Pipeline Automation: Built Docker-based plugins and Python scripts to integrate production tools with internal asset management APIs (Ftrack), streamlining asset tracking for creative teams.
projects:
    title: Projects
    intro: >
    assignments:
      - title: Agentic Incident Triage (Architecture & Local MVP)
        link: "#"
        tagline: "Agentic Incident Triage Engine: Designed an automated triage system using agentic workflows to parse incident webhooks, execute automated root-cause analysis (RCA), and generate draft remediation PRs. Built and validated a local MVP using RAG and loop engineering; passed enterprise architecture review for GCP production rollout (Gemini, Cloud Run, Vertex AI, Google ADK)."
      - title: Release Whisperer AI Agent
        link: "#"
        tagline: "Release Whisperer AI Agent: Architected and deployed a GenAI agent on an internal enterprise AI platform that cross-references release documentation, implementation plans, deployment notes, ServiceNow change tickets, and Test Evidence Summary Reports (TESR). Automatically flags pre-deployment discrepancies, such as incorrect go-live windows, wrong build numbers, outstanding tests, and missing management approvals, significantly reducing release risk and audit overhead."
      - title: Incident Classification MLOps Pipeline (Side Project)
        link: "#"
        tagline: "Incident Classification MLOps Pipeline (Side Project): Built an end-to-end MLOps pipeline to benchmark ticket classification approaches, demonstrating that classic supervised ML outperformed local LLMs (Ollama / LLaMA 3) for low-latency routing. Implemented experiment tracking (MLflow), containerized API serving (Docker/Flask), CI/CD pipelines (GitHub Actions), and drift monitoring (Evidently, Grafana, Datadog)."
      - title: Enterprise Self-Service Portal & AI Data Query Engine
        link: "#"
        tagline: "Enterprise Self-Service Portal & AI Data Query Engine: Engineered a self-service application enabling business users to execute IAM/RBAC account lifecycle changes and complex data extracts independently. Integrated ServiceNow APIs with enterprise identity systems (myAccess) for automated entitlement checks, and embedded an AI agent backed by Google Data Platform to convert natural language queries directly into BigQuery SQL."
