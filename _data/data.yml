career-profile:
    title: Career Profile
    summary: |
      Production Support & Platform Engineer with 8+ years of software engineering experience — 5 years as a full-stack software engineer and 3 years as a platform support engineer — specializing in application-level reliability, internal developer enablement, and enterprise workflow automation.
      Proven track record of architecting API/SDK integrations across hybrid enterprise ecosystems (ServiceNow, Jira, Teams, Salesforce, Google Data Platform suite, AWS), deploying GenAI agents on internal platforms, and enforcing identity governance (IAM) and secrets management (HashiCorp Vault).
      Skilled in executing cross-platform developer migrations, engineering self-healing and AIOps solutions for incident triage and automated remediation, designing data masking layers, and maintaining robust observability across complex production environments.
      Highly proactive, adaptable to fast-changing technology landscapes, and committed to continuous improvement, architectural thinking, and operational excellence.

