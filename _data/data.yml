experiences:
    title: Working Experiences
    info:
      - role: Operations Analyst & AI Activator
        time: Aug 2023 - Present
        company: IAG, Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Agentic Software Engineering & Multi-System Orchestration:</strong> Architected and delivered functional agentic engineering workflows and MVPs (Agentic Incident Triage Engine using Gemini / Vertex AI, GCP Cloud Run, and vector databases). Engineered secure, parameterized tool endpoints and FastMCP servers that orchestrate multi-system enterprise APIs (ServiceNow, Datadog, Salesforce, Guidewire Cloud, AWS S3, BigQuery / Google Data Platform), enabling software agents to safely ingest context, execute diagnostics, and generate draft remediation PRs under strict least-privilege security boundaries.
          - <strong style="color: #666666;">Reusable Capabilities, Agent Instructions & Responsible AI Controls:</strong> Designed and standardized reusable engineering capabilities across squads, including modular agent instructions (system prompts and task boundaries), custom skills, automated evaluation benchmarks, and reference implementations. Embedded strict Responsible AI controls, PII data masking, and multi-agent challenger loops (e.g., Release Whisperer AI Agent) where a secondary reviewer agent independently challenges low-confidence outputs before human sign-off.
          - <strong style="color: #666666;">Reliable Workflows, Context Engineering & Escalation Mechanisms:</strong> Engineered resilient runtime harnesses providing software agents with scoped context windows, dynamic RAG injection, and deterministic fallback and recovery mechanisms. Established clear validation gates and automated escalation triggers that gracefully hand off execution to human engineers whenever confidence thresholds are unmet or sensitive operations occur, safeguarding production stability and auditability.
          - <strong style="color: #666666;">Converting Failures & Delivery Insights into Engineering Assets:</strong> Systematically transformed operational incidents, audit discrepancies, and recurring manual reviews into structural engineering improvements. Following an external audit risk on unverified release documentation, built an automated AI compliance reviewer that cross-references Jira, ServiceNow, and test artifacts, slashing manual review time from 30 minutes to 5 minutes while maintaining zero-defect regulatory compliance.
          - <strong style="color: #666666;">Engineering Mentorship & Practice Enablement:</strong> Served as an internal AI Activator across support and operations squads (GPNZ_OPS_SUPPORT & COMMERCIAL_POLICYCENTER_SUPPORT), driving practical adoption of AI coding tools, software agents, and agentic workflows. Coached engineers through their first agentic PRs, led technical design and code reviews, and authored comprehensive reference runbooks on agentic patterns and SRE principles. Led a team transformation that eliminated over 1,000 hours of manual operational toil per year.
          - <strong style="color: #666666;">Architectural Judgement (Deterministic vs. Agentic Systems):</strong> Applied sound engineering judgement to determine when agentic approaches are ready to scale versus when conventional deterministic engineering is required. For broker access code provisioning, replaced manual spreadsheet handling with an automated, deterministic Python-to-Gosu engine with safe public ID incrementation and comprehensive runtime logging, reducing turnaround from days to under 10 minutes with zero risk of database corruption.
      - role: Full Stack Software Engineer (Distributed Systems & Core Platforms)
        time: 2018 - 2023
        company: FIS (Fortune 500 Financial Technology Leader), Christchurch, New Zealand (Hybrid)
        details: |
          - <strong style="color: #666666;">Enterprise Platform Architecture & Extensibility:</strong> Engineered and maintained core financial modules within an asset finance monolith handling rating and billing for Tier-1 global institutions (HSBC, BMW Financial Services, Toyota Finance). Co-developed an extensible low-code business rules and workflow engine, empowering operations teams to safely configure complex business rules and workflows with minimal code changes.
          - <strong style="color: #666666;">Computational Performance & Algorithmic Optimization:</strong> Diagnosed and resolved critical performance bottlenecks, database deadlocks, and query latencies in high-throughput transactional backends (C#/.NET, SQL). Re-architected heavy rating calculation algorithms with lightweight pre-calculation caching and query optimization, slashing execution time from 60 seconds to 20 seconds.
          - <strong style="color: #666666;">Quality Engineering, CI/CD & Developer Enablement:</strong> Maintained platform stability across Dev, Test, and UAT environments through comprehensive automated test suites and robust CI/CD pipelines. Built internal developer tools, custom automation plugins, and documentation guides, accelerating squad onboarding and mentoring junior engineers.
      - role: Software Engineering Intern (Tooling & Pipeline Automation)
        time: 2017 - 2018 (3 months)
        company: Weta Workshop (Academy Award-Winning Creative Studio), Wellington, New Zealand
        details: |
          - <strong style="color: #666666;">Custom Plugins & Platform Extension:</strong> Developed custom Confluence wiki extensions that natively rendered 3D model formats inside internal documentation pages, bridging creative artists and technical engineering workflows.
          - <strong style="color: #666666;">Asset Pipeline Automation:</strong> Built containerized plugins and automation scripts connecting internal production creative tools directly with asset tracking APIs, eliminating manual asset entry and streamlining production tracking.
