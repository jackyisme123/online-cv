name: Deploy SRE site to Pages

on:
  push:
    branches: ["SRE-CV"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          cache-version: 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build SRE with Jekyll into /sre
        env:
          JEKYLL_ENV: production
        run: |
          set -e
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          BASE_PREFIX="${BASE_PATH%/}"

          # Build SRE CV directly into _site/sre
          bundle exec jekyll build --baseurl "${BASE_PREFIX}/sre" --destination "./_site/sre" --trace

          # Create root index redirecting to /sre/
          cat << 'EOF' > ./_site/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=./sre/" />
            </head>
            <body>
              <p>Redirecting to <a href="./sre/">SRE CV</a>...</p>
            </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
